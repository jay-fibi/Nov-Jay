apiVersion: v1
kind: Pod
metadata:
  name: sample-pod
  labels:
    app: sample-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi